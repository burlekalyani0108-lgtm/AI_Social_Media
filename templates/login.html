<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .auth-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 30px 40px;
            text-align: center;
        }
        .logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 46px;
            color: #262626;
            margin-bottom: 28px;
            display: block;
            text-decoration: none;
        }
        .error-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .input-group {
            margin-bottom: 8px;
        }
        .auth-input {
            width: 100%;
            height: 38px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 0 10px;
            font-size: 12px;
            color: #262626;
            outline: none;
            transition: border-color 0.15s;
        }
        .auth-input:focus { border-color: #a8a8a8; }
        .submit-btn {
            width: 100%;
            height: 34px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.15s;
        }
        .submit-btn:hover { background-color: #1877f2; }
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider span { padding: 0 16px; }

        .switch-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .switch-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        .moderation-badge {
            font-size: 11px;
            color: #64748b;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <a href="#" class="logo">Connect</a>

        {% if error %}
        <div class="error-banner">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" class="auth-input" placeholder="Phone number, username, or email" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" class="auth-input" placeholder="Password" required>
            </div>
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="moderation-badge">
            🛡️ AI Content Moderation System Active
        </div>
    </div>

    <div class="switch-card">
        Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
    </div>
</div>

</body>
</html>
